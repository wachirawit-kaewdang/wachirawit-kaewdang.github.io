# Weekly update pull requests for npm packages and for the pinned GitHub Actions. Actions are
# pinned by commit hash with a version comment; Dependabot updates both together.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
