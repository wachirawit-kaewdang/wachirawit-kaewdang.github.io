# Builds the site with Vite and publishes it to GitHub Pages on every push to main.
# Pull requests and manual runs on other branches run the same checks and build, but never deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the deploy job gets the Pages and OIDC token writes it needs, so
# the build (which runs pull-request code) never holds them.
permissions:
  contents: read

# One run per branch at a time, in order, so an older build can't deploy after a newer one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: python3 scripts/test_extract_metrics.py
      # Linked files, frozen results, résumé and share image (see scripts/check.mjs).
      - run: npm run check
      # Rebuild metrics.json from the frozen notebook kept in data/. Any difference means a number
      # was edited or misread. The extractor also checks the copy's git hash against metrics.json.
      - run: python3 scripts/extract-metrics.py data/notebook-0c4ef04.ipynb
      - run: git diff --exit-code src/metrics.json
      - run: npm run build
      # The built site must actually render in a browser (see scripts/render-check.mjs).
      - run: npm run render-check
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and a deploy already running is allowed to finish rather than being
    # cancelled half-way by the next push.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
