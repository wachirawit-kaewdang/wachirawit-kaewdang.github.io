# Builds the site with Vite and publishes it to GitHub Pages on every push to main.
# Pull requests and manual runs on other branches run the same checks and build, but never deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the deploy job gets the Pages and OIDC token writes it needs, so
# the build (which runs pull-request code) never holds them.
permissions:
  contents: read

# One run per branch at a time, in order, so an older build can't deploy after a newer one.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so every commit in a push can be scanned, not only the last one.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci
      # The same list a local `npm run verify` runs, so the two can't drift apart: lint, tests,
      # the checks, metrics.json rebuilt from the frozen notebook in data/, the build with its
      # pre-render, the rendered tables, and Back and Forward in a browser.
      - run: npm run verify
      # npm run verify scans the files as they are now. A push made without the hooks could add a
      # number in one commit and remove it in the next, so every commit in the history is scanned
      # too (files and messages, phone numbers only). The whole history is scanned, not just the
      # last push, because a cancelled run or a force-push can leave commits no run has seen. A
      # number found here is already public: remove it and rewrite history.
      - name: Scan every commit in the history for phone numbers
        if: github.event_name != 'pull_request'
        run: node scripts/check-phone.mjs --history
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and a deploy already running is allowed to finish rather than being
    # cancelled half-way by the next push.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # A green deploy only means Pages accepted the files. This asks the public address for the page
  # and fails unless the pre-rendered abstract is in the raw HTML, so a blank or stale site is
  # caught here. The string is the abstract's opening sentence in src/data.js (render-check
  # reads the same one); if that sentence is reworded, change it here too.
  smoke-test:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fetch the live page and look for the abstract
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # The CDN can serve the old page for a short while after a deploy, so try a few times.
          for attempt in 1 2 3 4 5 6; do
            page=$(curl --fail --silent --show-error --location --max-time 20 "$PAGE_URL" || true)
            if grep --quiet --fixed-strings 'I test my own results against a simple baseline' <<< "$page"; then
              echo "Live page at $PAGE_URL has the pre-rendered abstract (attempt $attempt)."
              exit 0
            fi
            echo "Attempt $attempt: abstract not found yet."
            sleep 15
          done
          echo "::error::The live page at $PAGE_URL does not contain the pre-rendered abstract."
          exit 1
