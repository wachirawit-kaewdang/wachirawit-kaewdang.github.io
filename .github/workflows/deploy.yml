# Builds the site with Vite and publishes it to GitHub Pages on every push to main.
# Pull requests and manual runs on other branches run the same checks and build, but never deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the deploy job gets the Pages and OIDC token writes it needs, so
# the build (which runs pull-request code) never holds them.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Every file the site links to must exist in public/ (see scripts/check.mjs).
      - run: npm run check
      # Rebuild metrics.json from the notebook at the frozen commit it records. Any difference
      # means a number was edited or misread. Full history, as that commit isn't the branch tip.
      - uses: actions/checkout@v4
        with:
          repository: wachirawit-kaewdang/Project-CS403
          path: notebook
          fetch-depth: 0
          filter: blob:none
      - run: python3 scripts/extract-metrics.py notebook
      - run: git diff --exit-code src/metrics.json
      - run: npm run build
      # The built site must actually render in a browser (see scripts/render-check.mjs).
      - run: npm run render-check
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One deploy at a time, and a deploy already running is allowed to finish rather than being
    # cancelled half-way by the next push.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
